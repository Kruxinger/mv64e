{% extends 'base.html' %}

{% block title %}Entwürfe – OncoApp{% endblock %}

{% block content %}
<div class="container my-4">
    <h3>Unfertige Fälle (Entwürfe)</h3>
    <table class="table table-striped">
        <thead>
        <tr>

            <th>Patienten ID</th>
            <th>GS Fall ID</th>
            <th>LMU Fall ID</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        {% for case in cases %}
        <tr>
            <td>{{ case.pat_id }}</td>
            <td>{{ case.case_id }}</td>
            <td>{{ case.local_case_id }}</td>
            <td class="d-inline-flex gap-2 w-100">

                <form action="{{ url_for('edit_case', case_id=case.case_id) }}"
                      method="get" class="m-0">
                    <button type="submit" class="btn btn-sm btn-primary">
                        Bearbeiten
                    </button>
                </form>

                <form action="{{ url_for('delete_case', case_id=case.case_id) }}"
                      method="post" class="m-0"
                      onsubmit="return confirm('Fall wirklich löschen?');">
                    <button type="submit" class="btn btn-sm btn-danger">
                        Löschen
                    </button>
                </form>

            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
