{% extends 'base.html' %}

{% block title %}Übertragung – OncoApp{% endblock %}

{% block content %}

<div class="container my-4">
  <h3>Konstanten bearbeiten</h3>
  <div class="alert alert-danger fw-bold">
    Diese Werte bitte nur mit großer Vorsicht anpassen! Änderungen könnten zu großem Unheil führen!
  </div>
  <form method="post" class="row g-3">
    {% for key, value in constants.items() %}
    <div class="col-md-6">
      <label class="form-label">{{ key }}</label>
      <input type="text" name="{{ key }}" class="form-control" value="{{ value }}">
    </div>
    {% endfor %}
    <div class="col-12 mt-4">
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</div>
{% endblock %}
