<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% include 'navbar.html' %}

<div class="container my-4">
  <h3>Logs</h3>

  <form method="get" class="row g-3 mb-3">
    <div class="col-md-4">
      <input type="text" name="case_id" class="form-control" placeholder="Filter nach Case-ID" value="{{ case_id }}">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary">Filtern</button>
    </div>
  </form>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Timestamp</th>
        <th>Patienten-ID</th>
        <th>Case-ID</th>
        <th>Typ</th>
        <th>Text</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr class="{{ 'table-danger' if log.type == 'error' else '' }}">
        <td>{{ log.timestamp }}</td>
        <td>{{ log.pat_id }}</td>
        <td>{{ log.case_id }}</td>
        <td>{{ log.type }}</td>
        <td>{{ log.text }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

</body>
</html>
