<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% include 'navbar.html' %}
<div class="container my-4">
  <h3>Dashboard – Übersicht Fälle</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Case-ID</th>
        <th>Patienten-ID</th>
        <th>Gender</th>
        <th>Geburtsdatum</th>
        <th>Library Type</th>
      </tr>
    </thead>
    <tbody>
      {% for case in cases %}
      <tr>
        <td>{{ case.id }}</td>
        <td>{{ case.case_id }}</td>
        <td>{{ case.pat_id }}</td>
        <td>{{ case.gender }}</td>
        <td>{{ case.birthdate }}</td>
        <td>{{ case.librarytype }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
