{% extends 'base.html' %}

{% block title %}Alle Cases – OncoApp{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <h3 class="m-2">Alle Cases</h3>
    <div id="casesGrid"></div>
</div>

<!-- Grid.js CSS & JS -->
<link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
<script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>

<style>
    /* kompakte Tabelle */
    .gridjs-container {
        font-size: 0.75rem; /* kleiner */
    }
    .gridjs-table {
        margin: 0; /* keine Ränder */
    }
    .gridjs-header, .gridjs-th, .gridjs-td {
        padding: 2px 4px; /* kompakte Zellen */
    }
    .gridjs-pagination {
        font-size: 0.75rem;
    }
    .gridjs-th {
    white-space: nowrap;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const columns = {{ columns | tojson }};
    const data = {{ cases | tojson }};

    // transformiere data zu Array of Arrays für Grid.js
    const rows = data.map(row => columns.map(col => row[col]));

    new gridjs.Grid({
        columns: columns.map(col => ({
            name: col,
            formatter: (cell) => gridjs.html(`<span title="${cell}">${cell}</span>`)
        })),
        data: rows,
        pagination: {
            enabled: true,
            limit: 10  // nur 10 Zeilen pro Seite
        },
        search: true,
        sort: true,
        resizable: true,
        width: "100%",
        autoWidth: true
    }).render(document.getElementById("casesGrid"));
});
</script>
{% endblock %}
