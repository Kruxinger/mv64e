<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Fall existiert bereits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h4 class="card-title mb-3">Fall existiert bereits</h4>

            <p class="card-text">
                Der Fall wurde bereits importiert.<br>
                Möchtest du ihn trotzdem erneut importieren und den bereits existierenden Fall überschreiben?
            </p>

            <div class="d-flex gap-3 mt-4">

                <!-- JA -->
                <form method="POST">
                    <input type="hidden" name="keep" value="{{ new_case_id }}">
                    <input type="hidden" name="remove" value="{{ existing_case_id }}">
                    <button type="submit" class="btn btn-danger">
                        Ja, neu importieren und alten verwerfen
                    </button>
                </form>

                <!-- NEIN -->
                <form method="POST">
                    <input type="hidden" name="keep" value="{{ existing_case_id }}">
                    <input type="hidden" name="remove" value="{{ new_case_id }}">
                    <button type="submit" class="btn btn-secondary">
                        Nein, Import abbrechen und alten behalten
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

</body>
</html>
