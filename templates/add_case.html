<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Fall hinzufügen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% include 'navbar.html' %}
<div class="container my-4">
  <h3>Fall hinzufügen</h3>
  <form method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Patienten-ID</label>
      <input type="text" name="pat_id" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Fall-ID</label>
      <input type="text" name="localCaseId" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select">
        <option value="männlich">männlich</option>
        <option value="weiblich">weiblich</option>
        <option value="divers">divers</option>
        <option value="unbekannt">unbekannt</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Geburtsdatum</label>
      <input type="date" name="birthDate" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Address AGS</label>
      <input type="text" name="addressAGS" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Include Decision</label>
      <select name="decsisionToInclude" class="form-select">
        <option>Ja</option>
        <option>Nein</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Molecular Board Decision Date</label>
      <input type="date" name="molecularBoardDescisionDate" class="form-control">
    </div>
    <div class="col-md-4" id="rejectionDiv" style="display:none;">
      <label class="form-label">Rejection Justification</label>
      <input type="text" name="rejectionJustification" class="form-control">
    </div>

    <div class="col-md-4">
      <label class="form-label">Main Diagnosis Date</label>
      <input type="date" name="mainDiagnosis_date" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Main Diagnosis Code</label>
      <input type="text" name="mainDiagnosis_code" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">ECOG Score</label>
      <input type="number" name="ecog" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Germline Confirmed</label>
      <select name="germlineConfirmed" class="form-select">
        <option>Ja</option>
        <option>Nein</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Histology Code</label>
      <input type="text" name="histology_code" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Topography Code</label>
      <input type="text" name="topography_code" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Library Type</label>
      <input type="text" name="libraryType" class="form-control" value="wgs">
    </div>
      <h5>MV Consent</h5>
<div class="col-md-4">
  <label class="form-label">Presentation Date</label>
  <input type="date" name="mvConsent_presentationDate" class="form-control">
</div>
<div class="col-md-4">
  <label class="form-label">mvSequencing Scope Date</label>
  <input type="date" name="mvConsent_scope_mvSequencing" class="form-control">
</div>
<div class="col-md-4">
  <label class="form-label">reIdentification Scope Date</label>
  <input type="date" name="mvConsent_scope_reIdentification" class="form-control">
</div>
<div class="col-md-4">
  <label class="form-label">caseIdentification Scope Date</label>
  <input type="date" name="mvConsent_scope_caseIdentification" class="form-control">
</div>


    <div class="col-12 mt-4">
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</div>

<script>
const selectInclude = document.querySelector('select[name="decsisionToInclude"]');
const rejectionDiv = document.getElementById('rejectionDiv');
selectInclude.addEventListener('change', () => {
    rejectionDiv.style.display = selectInclude.value === "Nein" ? "block" : "none";
});
</script>
</body>
</html>
