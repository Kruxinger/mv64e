# === docker-compose.yml angepasst ===
version: "3.9"

services:
  db:
    image: postgres:15
    container_name: onco_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./db_init.sql:/docker-entrypoint-initdb.d/db_init.sql:ro
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: "http://mitproxy0.srv.med.uni-muenchen.de:8080"
        https_proxy: "http://mitproxy0.srv.med.uni-muenchen.de:8080"
        no_proxy: "localhost,127.0.0.1,db,keycloak,gpas,diz"
    container_name: onco_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HTTP_PROXY: "http://mitproxy0.srv.med.uni-muenchen.de:8080"
      HTTPS_PROXY: "http://mitproxy0.srv.med.uni-muenchen.de:8080"
      NO_PROXY: "localhost,127.0.0.1,db,keycloak,gpas,diz"
      REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
      CURL_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:
