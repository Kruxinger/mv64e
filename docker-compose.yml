version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: onco
      POSTGRES_USER: onco_user
      POSTGRES_PASSWORD: onco_pass
    volumes:
      - ./db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    ports:
      - "5432:5432"

  web:
    build: .
    depends_on:
      - db
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: onco
      POSTGRES_USER: onco_user
      POSTGRES_PASSWORD: onco_pass
